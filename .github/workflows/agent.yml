name: agent-control

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm agent:check
      - run: pnpm --filter terminal-browser-cli test
      - run: pnpm --filter pixel-react exec tsc -p tsconfig.json
      - run: pnpm --filter pixel-store build
      - run: pnpm --filter pixel-terminals build
      - run: pnpm --filter terminal-browser typecheck
      - run: pnpm --filter terminal-browser build

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm agent:live-smoke
        env:
          TERMINAL_BROWSER_SMOKE_NO_SANDBOX: "1"
          TERMINAL_BROWSER_EVALUATION_ARTIFACT: ${{ github.workspace }}/agent-evaluation-report.json
          TERMINAL_BROWSER_EVALUATION_TRACE: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-report
          path: agent-evaluation-report.json
          if-no-files-found: warn
