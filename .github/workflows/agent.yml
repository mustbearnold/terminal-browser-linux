name: agent-control

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm agent:check
      - run: pnpm --filter pixel-react exec tsc -p tsconfig.json
      - run: pnpm --filter pixel-store build
      - run: pnpm --filter pixel-terminals build
      - run: pnpm --filter terminal-browser typecheck
      - run: pnpm --filter terminal-browser build

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure Electron sandbox
        run: |
          ELECTRON_MODULE="$(pnpm --filter terminal-browser exec node -p 'require.resolve("electron")')"
          SANDBOX_PATH="$(dirname "$ELECTRON_MODULE")/dist/chrome-sandbox"
          sudo chown root:root "$SANDBOX_PATH"
          sudo chmod 4755 "$SANDBOX_PATH"
      - run: xvfb-run -a pnpm agent:live-smoke
